<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TFT VU CYD Installer</title>
</head>
<body style="font-family: Arial; text-align: center; margin-top: 50px;">
  <h1>Install TFT VU CYD</h1>
  <p>Connect your CYD, select the port, and click install.</p>
  
  <esp-web-install-button manifest="manifest.json">
    <button slot="activate" style="background: #007bff; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 5px; cursor: pointer;">Install on CYD</button>
  </esp-web-install-button>

  <script type="module" src="https://unpkg.com/esp-web-tools@10/dist/web/install-button.js?module"></script>
</body>
</html>
